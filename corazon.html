<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Para mi amor 💚</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #FAF7F2; /* Fondo Crema ultra claro (como querías) */
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            width: 100vw;
            /* Previene comportamientos extraños de zoom táctil en móviles */
            touch-action: none; 
        }
        
        /* El lienzo ocupa TODA la pantalla */
        canvas { 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%;
            height: 100%;
            z-index: 1; 
        }
        
       /* BOTÓN BLANCO Y BOTÁNICO (100% Fluido y Responsive) */
        .btn-centro {
            position: relative;
            z-index: 10;
            background: #ffffff; 
            color: #4a7c59; 
            border: 2px solid #4a7c59;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Lora', serif;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(74, 124, 89, 0.15);
            text-align: center;
            display: inline-block;
            
            /* LA MAGIA RESPONSIVE: clamp(Mínimo, Escala Dinámica, Máximo) */
            /* El relleno y la letra crecen o se achican suavemente según el tamaño del celu */
            padding: clamp(8px, 2vh, 12px) clamp(16px, 5vw, 24px); 
            font-size: clamp(0.75rem, 3.5vw, 1rem); 
            
            /* Tope máximo de ancho para que respire en los costados */
            max-width: 80vw; 
        }

        .btn-centro:hover {
            background: #4a7c59;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(74, 124, 89, 0.35);
            transform: scale(1.05);
        }
        
        /* (Ya podés borrar la regla @media (max-width: 400px) que tenías abajo, ya no hace falta) */
    </style>
</head>
<body>

    <a href="6meses.html" class="btn-centro">Entrar a nuestros 6 meses ✨</a>

    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        
        // --- VARIABLES DINÁMICAS QUE CAMBIARÁN SEGÚN LA PANTALLA ---
        let currentScale = 16; // Factor de tamaño del corazón
        let currentFontSize = 14; // Tamaño de letra del "te amo tochi"

        // Función del motor de re-escalado: Se ejecuta al cargar y al girar el celu
        function redimensionar() {
            // 1. Sincronizamos el tamaño de resolución del lienzo con el tamaño de pantalla
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // 2. Definimos valores base para PC (pantallas de más de 600px de ancho)
            const BASE_SCALE = 16;
            const BASE_FONT_SIZE = 14;

            // 3. LA MAGIA RESPONSIVE: Si es una pantalla angosta (celular/tablet)
            if (window.innerWidth < 600) {
                // Hacemos que la escala dependa directamente del ancho de la pantalla
                // y le ponemos límites (Math.max/min) para que nunca sea ni muy chico ni muy grande.
                currentScale = Math.max(7, Math.min(BASE_SCALE, window.innerWidth / 40)); 
                // Hacemos lo mismo con el tamaño de la fuente para que no se empaste
                currentFontSize = Math.max(10, Math.min(BASE_FONT_SIZE, window.innerWidth / 35));
            } else {
                // Si es PC, mantenemos los valores originales
                currentScale = BASE_SCALE;
                currentFontSize = BASE_FONT_SIZE;
            }
        }
        
        // Ejecutamos la función apenas arranca la página
        window.addEventListener('resize', redimensionar);
        redimensionar();

        let angle = 0;
        const NUM_STEPS = 70;
        const TEXT = "te amo tochi"; 

        // Fórmulas matemáticas del corazón
        function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
        function heartY(t) { return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t); }

        function draw() {
            // Esta línea limpia la pantalla con una estela semitransparente del color de fondo (#FAF7F2)
            ctx.fillStyle = "rgba(250, 247, 242, 0.45)"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Usamos las variables dinámicas calculadas en redimensionar()
            ctx.font = `bold ${currentFontSize}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#4a7c59"; // Verde botánico

            for (let i = 0; i < NUM_STEPS; i++) {
                let t = (i * Math.PI * 2) / NUM_STEPS + angle;
                // Multiplicamos la fórmula por currentScale (el factor responsive)
                let x = cx + heartX(t) * currentScale; 
                let y = cy - heartY(t) * currentScale; 
                
                ctx.fillText(TEXT, x, y);
            }
            
            // Velocidad suave de rotación
            angle += 0.003; 
            requestAnimationFrame(draw);
        }

        // Iniciamos la animación
        draw();
    </script>
</body>
</html>
